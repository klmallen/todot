<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D编辑器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #1e1e1e;
      color: #e0e0e0;
    }
    
    .editor-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    
    .header {
      height: 40px;
      background-color: #333;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-bottom: 1px solid #444;
    }
    
    .logo {
      font-size: 18px;
      font-weight: bold;
      margin-right: 20px;
    }
    
    .toolbar {
      display: flex;
      align-items: center;
    }
    
    .toolbar-button {
      background-color: #555;
      border: none;
      color: white;
      padding: 5px 10px;
      margin-right: 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    
    .toolbar-button:hover {
      background-color: #666;
    }
    
    .left-panel {
      display: flex;
      flex-direction: column;
      width: 250px;
      background-color: #252525;
      border-right: 1px solid #444;
    }
    
    .panel-section {
      margin-bottom: 10px;
    }
    
    .panel-header {
      height: 30px;
      background-color: #333;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-weight: bold;
      border-bottom: 1px solid #444;
    }
    
    .panel-content {
      padding: 10px;
      overflow-y: auto;
    }
    
    #scene-tree {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }
    
    .viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    #scene-canvas {
      width: 100%;
      height: 100%;
    }
    
    .viewport-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .transform-gizmo-controls {
      display: flex;
      align-items: center;
    }
    
    .gizmo-btn {
      background-color: #555;
      border: none;
      color: white;
      padding: 5px 10px;
      margin-right: 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    
    .gizmo-btn.active {
      background-color: #666;
    }
    
    .right-panel {
      width: 300px;
      background-color: #252525;
      border-left: 1px solid #444;
    }
    
    #properties-panel {
      padding: 10px;
      overflow-y: auto;
    }
    
    .status-bar {
      height: 25px;
      background-color: #333;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid #444;
      font-size: 12px;
    }
    
    .spacer {
      flex: 1;
    }
    
    #scene-tree-context-menu {
      position: absolute;
      background-color: #333;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 5px 0;
      z-index: 1000;
      min-width: 150px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      display: none;
    }
    
    .context-menu-item {
      padding: 5px 10px;
      cursor: pointer;
    }
    
    .context-menu-item:hover {
      background-color: #444;
    }
    
    .context-menu-divider {
      height: 1px;
      background-color: #555;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div id="root">
    <div onclick="alert('你点击了这个div!')">123</div>
  </div>
  <script type="module" src="/src/physicsDemo.ts"></script>
</body>
</html>
