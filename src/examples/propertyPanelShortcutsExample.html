<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>属性面板增强功能示例</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #1e1e1e;
      color: #fff;
    }
    
    #container {
      width: 100%;
      height: 100vh;
      position: relative;
    }
    
    #canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    .info-overlay {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      max-width: 400px;
      z-index: 1000;
    }
    
    .info-overlay h3 {
      margin-top: 0;
      color: #3080ff;
    }
    
    .info-overlay p {
      margin-bottom: 8px;
    }
    
    .info-overlay kbd {
      background-color: #333;
      border-radius: 3px;
      border: 1px solid #666;
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
      color: #fff;
      display: inline-block;
      font-family: monospace;
      font-size: 0.85em;
      font-weight: 700;
      line-height: 1;
      padding: 3px 5px;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="canvas"></canvas>
    
    <div class="info-overlay">
      <h3>属性面板增强功能示例</h3>
      <p>本示例展示了引擎中属性面板的增强功能：</p>
      <p>- 使用 <kbd>Ctrl</kbd> + <kbd>P</kbd> 快捷键切换属性面板显示/隐藏</p>
      <p>- 支持同时显示多个属性面板</p>
      <p>- 可以快速切换显示不同节点的属性</p>
      <p>- 使用左侧按钮尝试这些功能</p>
    </div>
  </div>
  
  <script type="module" src="./propertyPanelShortcutsExample.js"></script>
</body>
</html>
